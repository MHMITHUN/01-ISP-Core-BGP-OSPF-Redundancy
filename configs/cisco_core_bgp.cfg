! ==============================================================================
! Cisco IOS Core Router Configuration: ISP Dual-Homed BGP & OSPF Core
! Device: Core-Router-01 (AS 65001)
! Author: Md. Mahamudul Hasan (Support Engineer - ISP Software & Networking)
! ==============================================================================

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
service sequence-numbers

hostname ISP-CORE-R01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
no aaa new-model
ip cef
!
! --- Public IP Prefix Definition ---
ip prefix-list OUR-PUBLIC-PREFIX seq 5 permit 103.140.18.0/24
ip prefix-list BOGONS-FILTER seq 10 deny 10.0.0.0/8 le 32
ip prefix-list BOGONS-FILTER seq 20 deny 172.16.0.0/12 le 32
ip prefix-list BOGONS-FILTER seq 30 deny 192.168.0.0/16 le 32
ip prefix-list BOGONS-FILTER seq 40 deny 127.0.0.0/8 le 32
ip prefix-list BOGONS-FILTER seq 50 permit 0.0.0.0/0
!
! --- Route Maps for BGP Traffic Engineering ---
route-map FROM-ISP-A-IN permit 10
 match ip address prefix-list BOGONS-FILTER
 set local-preference 200
!
route-map TO-ISP-A-OUT permit 10
 match ip address prefix-list OUR-PUBLIC-PREFIX
!
route-map FROM-ISP-B-IN permit 10
 match ip address prefix-list BOGONS-FILTER
 set local-preference 100
!
route-map TO-ISP-B-OUT permit 10
 match ip address prefix-list OUR-PUBLIC-PREFIX
 set as-path prepend 65001 65001
!
! --- Physical & Loopback Interfaces ---
interface Loopback0
 description Router-ID & BGP Peering Source
 ip address 103.140.18.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet0/0
 description Upstream Primary Link -> ISP-A (AS 64512)
 ip address 203.0.113.2 255.255.255.252
 duplex full
 speed 1000
 no shutdown
!
interface GigabitEthernet0/1
 description Upstream Secondary Link -> ISP-B (AS 64513)
 ip address 198.51.100.2 255.255.255.252
 duplex full
 speed 1000
 no shutdown
!
interface GigabitEthernet0/2
 description Internal Trunk -> Aggregation Switch / OLT Gateway
 ip address 10.10.10.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf message-digest-key 1 md5 AsianNetOspfKey2026
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 duplex full
 speed 1000
 no shutdown
!
! --- OSPF Interior Gateway Protocol ---
router ospf 1
 router-id 103.140.18.1
 log-adjacency-changes
 area 0 authentication message-digest
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
 default-information originate always metric 10
!
! --- BGP Autonomous System 65001 ---
router bgp 65001
 bgp router-id 103.140.18.1
 bgp log-neighbor-changes
 network 103.140.18.0 mask 255.255.255.0
 !
 ! Primary eBGP Neighbor (ISP-A)
 neighbor 203.0.113.1 remote-as 64512
 neighbor 203.0.113.1 description Primary_Upstream_ISP_A
 neighbor 203.0.113.1 route-map FROM-ISP-A-IN in
 neighbor 203.0.113.1 route-map TO-ISP-A-OUT out
 !
 ! Secondary eBGP Neighbor (ISP-B)
 neighbor 198.51.100.1 remote-as 64513
 neighbor 198.51.100.1 description Secondary_Upstream_ISP_B
 neighbor 198.51.100.1 route-map FROM-ISP-B-IN in
 neighbor 198.51.100.1 route-map TO-ISP-B-OUT out
 !
 ! iBGP Internal Peering (Core-2 / Aggregation)
 neighbor 10.10.10.2 remote-as 65001
 neighbor 10.10.10.2 update-source Loopback0
 neighbor 10.10.10.2 next-hop-self
!
ip forward-protocol nd
ip route 103.140.18.0 255.255.255.0 Null0
!
control-plane
!
line con 0
 exec-timeout 15 0
 logging synchronous
line vty 0 4
 transport input ssh
!
end

